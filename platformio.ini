; Nucleo F446RE — Induction Heater PLL Controller
; Modular driver scaffold.

; ---- Shared settings ----
[common]
platform = ststm32
board = nucleo_f446re
framework = arduino
monitor_speed = 115200
upload_protocol = mbed
upload_port = /Volumes/NOD_F446RE
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.4
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0

; ---- Normal firmware ----
[env:nucleo_f446re]
extends = common
build_flags =
	-Wall

; ---- PWM bench test mode (Phase 2) ----
; Build/upload with:  pio run -e pwm_test -t upload
; Generates complementary PWM on PA8/PB13 for AD3 probing.
; NO POWER STAGE — signal generation only.
[env:pwm_test]
extends = common
build_flags =
	-Wall
	-DPWM_TEST_MODE
