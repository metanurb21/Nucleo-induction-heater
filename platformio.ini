; Nucleo F446RE — Induction Heater PLL Controller
; Modular driver scaffold.

; ---- Shared settings ----
[common]
platform = ststm32
board = nucleo_f446re
framework = arduino
monitor_speed = 115200
upload_protocol = mbed
upload_port = /Volumes/NOD_F446RE
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.4
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0

; ---- Normal firmware ----
[env:nucleo_f446re]
extends = common
build_flags =
	-Wall

; ---- PWM bench test mode (Phase 2) ----
; Build/upload with:  pio run -e pwm_test -t upload
; Generates complementary PWM on PA8/PB13 for AD3 probing.
; NO POWER STAGE — signal generation only.
[env:pwm_test]
extends = common
build_flags =
	-Wall
	-DPWM_TEST_MODE

; ---- TFT hello-world sanity test ----
; Build/upload with:  pio run -e tft_hello -t upload
; Touches ONLY the TFT + backlight pin, nothing else in the project.
; Serial (115200) prints progress at each init step to localize a hang.
[env:tft_hello]
extends = common
build_flags =
	-Wall
	-DTFT_HELLO_MODE

; ---- Pin integrity / ADC leakage check ----
; Build/upload with:  pio run -e pin_check -t upload
; Bench tool for deciding whether any Nucleo pin was damaged during the
; OCP bring-up. Touches only the pins under test — no contactor, no PWM
; outputs, no state machine, no display. Needs 2x100k, 2x1k and a 1k.
; Measures ADC input leakage by reading each pin through two known source
; impedances; see the header block in src/main.cpp for the method.
; NO HV, NO OCP BOARD, NO POWER STAGE.
[env:pin_check]
extends = common
build_flags =
	-Wall
	-DPIN_CHECK_MODE

; ---- Manual drive mode (no PLL, no OCP, no coil feedback) ----
; Build/upload with:  pio run -e manual_drive -t upload
; Full real run: contactor, HV, IGBT bridge, real coil current.
; Encoder directly sets PWM frequency (no PLL feedback armed at all).
; NTC over-temp is the ONLY automated protection active — everything
; else is manual: variac ramp, IR temp gun, watching DC bus V/A.
; See docs/MANUAL_DRIVE_MODE.md before using this build.
[env:manual_drive]
extends = common
build_flags =
	-Wall
	-DMANUAL_DRIVE_MODE
