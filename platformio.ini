; Nucleo F446RE — Induction Heater PLL Controller
; Modular driver scaffold.

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino
monitor_speed = 115200
upload_protocol = mbed
upload_port = /Volumes/NOD_F446RE

lib_deps =
	adafruit/Adafruit GFX Library@^1.12.4
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0

build_flags =
	-Wall
